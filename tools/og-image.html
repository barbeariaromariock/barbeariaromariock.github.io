<!doctype html>
<!--
  Modelo da imagem de prévia (assets/og-image.jpg, 1200x630).
  Para gerar de novo, com o site rodando em http://localhost:5173:
  msedge --headless=new --hide-scrollbars --virtual-time-budget=6000 --window-size=1200,630 --screenshot=og.png http://localhost:5173/tools/og-image.html
  Depois converta og.png para JPG (menos de 300 KB, limite do WhatsApp) e salve como assets/og-image.jpg.
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Kaushan+Script&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    .og {
      position: relative; isolation: isolate; overflow: hidden;
      width: 1200px; height: 630px;
      display: grid; grid-template-columns: 500px 1fr; align-items: center; gap: 20px;
      padding: 0 70px 0 60px;
      background:
        radial-gradient(900px 620px at 8% 0%, #FFFAEE 0%, rgba(255, 250, 238, 0) 70%),
        linear-gradient(180deg, #F6EFE4 0%, #EDE3D2 100%);
    }
    .og .badge { width: 410px; }
    .og .lockup-badge { font-size: 54px; }
    .og .hero-visual { place-items: center start; }
    .og .pole { right: 8px; }
    .og .pole-body { height: 330px; animation: none; }
    .og .hero-title .script { font-size: 100px; white-space: nowrap; }
    .og .hero-title .kicker { font-size: 21px; }
    .og .gold-stroke { width: 330px; margin: 14px 0 30px; }
    .og-info { display: flex; gap: 14px; flex-wrap: wrap; }
    .og-chip {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 12px 20px; border-radius: 999px;
      font: 700 18px/1 var(--f-sans); letter-spacing: .04em;
      background: var(--ink); color: var(--paper);
    }
    .og-chip svg { width: 22px; height: 22px; color: var(--gold-light); }
    .og-chip.light { background: rgba(255, 255, 255, .6); color: var(--ink); box-shadow: inset 0 0 0 1.5px rgba(22, 21, 19, .2); }
    .og-chip.light svg { color: var(--gold-deep); }
    * { animation: none !important; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <symbol id="i-wa" viewBox="0 0 24 24"><path fill="currentColor" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
      <symbol id="i-razor" viewBox="0 0 64 64"><path fill="currentColor" d="M27.5 29.5 51 5.2c2.3-2.3 6.3-.9 6.6 2.3.1 1-.3 2-1 2.8L33.7 35.8Z"/><path fill="currentColor" d="M29.6 36.4 10 58.6c-1 1.1-2.8.4-2.8-1.1 0-.4.2-.8.4-1.1L25.8 33Z"/><circle cx="28.4" cy="34.6" r="3.4" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
    </defs>
  </svg>

  <div class="og grain">
    <div class="sunlight"></div>
    <div class="hero-visual" style="min-height:0">
      <div class="badge">
        <div class="lockup lockup-badge">
          <svg class="lockup-razor"><use href="#i-razor"/></svg>
          <span class="wordmark">ROMAR<span class="wm-pole"></span>OCK</span>
          <span class="wm-sub"><i>★</i> Barbearia <i>★</i></span>
          <span class="wm-since">Desde 2018</span>
        </div>
      </div>
      <div class="pole">
        <span class="pole-ball"></span><span class="pole-cap"></span><span class="pole-body"></span><span class="pole-cap pole-cap-bottom"></span>
      </div>
    </div>

    <div>
      <h1 class="hero-title">
        <span class="kicker">Sempre pronto pra</span>
        <span class="script">dar um tapa</span>
        <span class="kicker">no seu visual</span>
      </h1>
      <svg class="gold-stroke" viewBox="0 0 300 24" preserveAspectRatio="none"><path d="M3 15C60 8 150 4 296 6.5c1.6.4 1.4 3-.4 3.2C200 12 110 14.5 22 20.5 10 21.4 1.5 19 3 15Z"/></svg>
      <div class="og-info">
        <span class="og-chip"><svg><use href="#i-wa"/></svg>(85) 98599-5850</span>
        <span class="og-chip light"><svg><use href="#i-pin"/></svg>Maracanaú · CE</span>
      </div>
    </div>
  </div>
</body>
</html>
